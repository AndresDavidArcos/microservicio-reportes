server:
  port: 8083
spring:
  application:
    name: "ReportesService"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null
adapter:
  dynamo-db:
    tableName: "reportes-crediva"
  jwt:
    secret: "${JWT_SECRET}"
    expiration-ms: 28800000
  scheduler:
    destinatario-reporte: "${DESTINATARIO_REPORTE:andretitauro@gmail.com}"
  ses:
    remitente-reporte: "${REMITENTE_REPORTE:andretitauro@gmail.com}"
aws:
  dynamodb:
    endpoint: ""
  region: "${AWS_REGION:us-east-2}"
  secretName: "crediya"
entrypoint:
  sqs:
    region: "${AWS_REGION:us-east-2}"
    queueUrl: "${SQS_QUEUE_URL_APROBACIONES}"
    waitTimeSeconds: 20
    maxNumberOfMessages: 10
    visibilityTimeoutSeconds: 10
    numberOfThreads: 1
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "*"
