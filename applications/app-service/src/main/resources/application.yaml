server:
  port: 8083
spring:
  application:
    name: "ReportesService"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null
adapter:
  dynamo-db:
    tableName: "reportes-crediva"
  jwt:
    secret: "${JWT_SECRET}"
    expiration-ms: 28800000
  ses:
    remitente-reporte: "${REMITENTE_REPORTE:andretitauro@gmail.com}"
  restconsumer:
    timeout: 5000
    url: "${AUTH_SERVICE_URL}"
aws:
  dynamodb:
    endpoint: ""
  region: "${AWS_REGION:us-east-2}"
  secretName: "crediya"
entrypoint:
  sqs:
    region: "${AWS_REGION:us-east-2}"
    queueUrl: "${SQS_QUEUE_URL_APROBACIONES}"
    waitTimeSeconds: 20
    maxNumberOfMessages: 10
    visibilityTimeoutSeconds: 10
    numberOfThreads: 1
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
  health:
    circuitbreakers:
      enabled: true
cors:
  allowed-origins: "*"
resilience4j:
  circuitbreaker:
    instances:
      testGet:
        registerHealthIndicator: true
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: "2s"
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        waitDurationInOpenState: "10s"
      testPost:
        registerHealthIndicator: true
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: "2s"
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        waitDurationInOpenState: "10s"
